max_file_size: 500KB
exclude_patterns:
- "**/.*"
- "**/node_modules"
- "**/target"
- "**/out"
- "**/dist"
- "**/build"
- "**/coverage"
- "**/__pycache__"
- "docs/**"
- "graphify-out/**"
- "**/*.log"
include_patterns:
- "**/*.ts"
- "**/*.tsx"
- "**/*.js"
- "**/*.jsx"
- "**/*.mjs"
- "**/*.cjs"
- "**/*.py"
- "**/*.rs"
- "**/*.go"
- "**/*.cs"
- "**/*.c"
- "**/*.cpp"
- "**/*.h"
- "**/*.hpp"
- "**/*.lua"
- "**/*.php"
- "**/*.sql"
- "**/*.json"
- "**/*.yaml"
- "**/*.yml"
- "**/*.toml"
